[workspace]
resolver = "3"
members = [
    "cli",
    "config",
    "core",
    "rootfs",
    "runtime",
    "tools/rootfs_cli",
    "util",
]
default-members = ["cli"]

[workspace.package]
version = "0.1.0"
authors = ["WuX"]

[workspace.dependencies]
chariot_config = { path = "config" }
chariot_core = { path = "core" }
chariot_rootfs = { path = "rootfs" }
chariot_runtime = { path = "runtime" }
chariot_util = { path = "util" }
anyhow = "1.0.103"
colored = "3.1.1"
clap = "4.6.7"
nix = "0.31.2"
thiserror = "2.0.18"
toml = "1.1.2"
serde = "1.0.228"
log = "0.4.33"
