[package]
name = "chariot_cli"
edition = "2024"
version.workspace = true
authors.workspace = true

[[bin]]
name = "chariot"
path = "src/main.rs"

[dependencies]
chariot_util.workspace = true
chariot_config.workspace = true
chariot_core.workspace = true
chariot_rootfs.workspace = true
chariot_runtime.workspace = true
anyhow.workspace = true
colored.workspace = true
log.workspace = true
nix = { workspace = true, features = ["signal"] }
indicatif = "0.18.6"
clap = { workspace = true, features = ["derive", "env"] }
clap_complete = "4.6.11"
toml.workspace = true
serde = { workspace = true, features = ["derive"] }
dialoguer = "0.12.0"
serde_json = "1.0.151"
